  This example shows a heatmap of 1'000'000 point with hover.

<div id="map" class="map"></div>
<form>
  <label for="radius">radius size</label>
  <input id="radius" type="range" min="1" max="50" step="1" value="1"/>
  <label for="blur">blur size</label>
  <input id="blur" type="range" min="1" max="50" step="1" value="1"/>
</form>
